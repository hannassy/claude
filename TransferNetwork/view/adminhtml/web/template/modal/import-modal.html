<div class="modal-popup import-relations-modal" data-bind="visible: visible" style="display: none;">
    <div class="modal-inner-wrap">
        <header class="modal-header">
            <h1 class="modal-title">Import Relations from Excel</h1>
            <button class="action-close" type="button" data-bind="click: closeModal">
                <span>Close</span>
            </button>
        </header>
        <div class="modal-content">
            <div class="admin__fieldset">
                <div class="admin__field">
                    <label class="admin__field-label">
                        <span>Select Excel/CSV File</span>
                    </label>
                    <div class="admin__field-control">
                        <input type="file" accept=".xlsx,.xls,.csv" id="import-file-input">
                    </div>
                </div>
            </div>
        </div>
        <footer class="modal-footer">
            <button type="button" class="action-secondary" data-bind="click: closeModal">
                <span>Cancel</span>
            </button>
            <button type="button" class="action-primary" data-bind="click: importFile">
                <span>Import</span>
            </button>
        </footer>
    </div>
</div>
